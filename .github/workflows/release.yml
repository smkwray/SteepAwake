name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned build tools
        shell: pwsh
        run: .\scripts\setup-build-tools.ps1

      - name: Validate source
        shell: pwsh
        env:
          AUTOHOTKEY_PATH: ${{ github.workspace }}\.tools\AutoHotkey\AutoHotkey64.exe
        run: .\tests\Smoke.ps1

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match VERSION $version."
          }

      - name: Build portable app and installer
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Validate release artifacts
        shell: pwsh
        run: .\tests\ReleaseSmoke.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SteepAwake-${{ github.sha }}
          path: |
            dist/SteepAwake.exe
            dist/SteepAwake-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            '.\dist\SteepAwake.exe'
            '.\dist\SteepAwake-Setup.exe'
            '.\dist\SHA256SUMS.txt'
          )
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" @assets --clobber
          } else {
            gh release create "${{ github.ref_name }}" @assets `
              --title "SteepAwake ${{ github.ref_name }}" `
              --generate-notes
          }
